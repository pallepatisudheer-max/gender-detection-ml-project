<!DOCTYPE html>
<html>
<head>
    <title>Gender Detection</title>
</head>
<body>
    <h1>Gender Detection Using ML</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="Enter Name" required>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h2>Predicted Gender: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
